[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrouter"
version = "1.0.0"
description = "A routing/orchestration library (adjust as needed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pratham Tomar", email = "prathamtomar1733@gmail.com" }]
dependencies = [
    "cerebras_cloud_sdk>=1.67.0",
    "google-genai>=2.4.0",
    "groq>=1.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["examples*", "testenv*"]